<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Events - Informative App</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <h1>Upcoming Events</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <h2>Upcoming Events</h2>

    <label for="eventFilter">Filter by Category:</label>
    <select id="eventFilter" onchange="filterEvents()">
      <option value="all">All</option>
      <option value="exam">Exams</option>
      <option value="sports">Sports</option>
    </select>

    <input type="text" id="searchBar" placeholder="Search for an event..." onkeyup="searchEvents()">

    <ul id="eventList">
      <!-- Events will be loaded here dynamically -->
    </ul>

    <h3>Add a New Event</h3>
    <form id="eventForm">
    <label>Event Name:</label>
<input type="text" id="eventName" required><br>

<label>Date:</label>
<input type="date" id="eventDate" required><br>

<label>Location:</label>
<input type="text" id="eventLocation" placeholder="e.g., Delhi, Mumbai" required><br>

<label for="reminderDays">Reminder (days before event):</label>
<input type="number" id="reminderDays" min="0" max="30" value="1">

<label>Category:</label>
<select id="eventType">
  <option value="exam">Exam</option>
  <option value="sports">Sports</option>
</select><br>


      <button type="submit">Add Event</button>
    </form>
  </main>

  <script src="script.js"></script>
 
  <footer>
    <p>&copy; 2025 Informative App</p>
  </footer>
  <div id="toast-container"></div>
  <!-- Edit Event Modal -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>Edit Event</h3>
    <label>Name:</label>
    <input type="text" id="editName" />

    <label>Date:</label>
    <input type="date" id="editDate" />

    <label>Location:</label>
    <input type="text" id="editLocation" />

    <label>Category:</label>
    <select id="editType">
      <option value="exam">Exam</option>
      <option value="sports">Sports</option>
    </select>

    <label for="editReminderDays">Reminder (days before event):</label>
    <input type="number" id="editReminderDays" min="0" max="30" value="1" />

    <div class="modal-actions">
      <button onclick="saveEdit()">💾 Save</button>
      <button onclick="closeModal()">❌ Cancel</button>
    </div>
  </div>
</div>

</body>
</html>
